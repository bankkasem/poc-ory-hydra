name: poc-ory-hydra

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-password
      MYSQL_DATABASE: app_db
      MYSQL_USER: poc
      MYSQL_PASSWORD: local-poc-password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 30

  hydra-migrate:
    image: oryd/hydra:v26.2.0
    command: migrate -c /etc/config/hydra/hydra.yml sql up -e --yes
    environment:
      DSN: mysql://poc:local-poc-password@tcp(mysql:3306)/hydra_db?parseTime=true
    volumes:
      - ./docker/hydra/hydra.yml:/etc/config/hydra/hydra.yml:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  hydra:
    image: oryd/hydra:v26.2.0
    command: serve -c /etc/config/hydra/hydra.yml all --dev
    environment:
      DSN: mysql://poc:local-poc-password@tcp(mysql:3306)/hydra_db?parseTime=true
    ports:
      - "127.0.0.1:4444:4444"
      - "127.0.0.1:4445:4445"
    volumes:
      - ./docker/hydra/hydra.yml:/etc/config/hydra/hydra.yml:ro
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql-data:
